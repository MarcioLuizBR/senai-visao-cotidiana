[project]
name = "senai-visao-cotidiana"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pycocotools>=2.0.11",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.183",
]

# Usa as distribuições de CPU do PyTorch e do Torchvision.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# Este índice fica reservado aos pacotes indicados acima.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
